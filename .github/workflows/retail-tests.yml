name: Retail Forecasting Validation

on:
  push:
    branches:
      - main
    paths:
      - "retail-sales-forecasting/**"
      - ".github/workflows/retail-tests.yml"
  pull_request:
    paths:
      - "retail-sales-forecasting/**"
      - ".github/workflows/retail-tests.yml"

jobs:
  validate-retail-forecasting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retail-sales-forecasting
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: retail-sales-forecasting/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run full retail forecasting and demand-planning pipeline
        run: python run_all.py

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        with:
          name: retail-forecasting-validation-reports
          path: |
            retail-sales-forecasting/reports/*.csv
            retail-sales-forecasting/reports/*.md
