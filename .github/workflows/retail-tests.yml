name: Retail forecasting tests

on:
  push:
    branches: [main, retail-demand-planning]
  pull_request:
    paths:
      - "retail-sales-forecasting/**"
      - ".github/workflows/retail-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retail-sales-forecasting
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: retail-sales-forecasting/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pytest

      - name: Run unit tests
        run: |
          pytest -q \\
            tests/test_metrics.py \\
            tests/test_features.py \\
            tests/test_volume_segmentation.py \\
            tests/test_walk_forward.py \\
            tests/test_run_all.py \\
            advanced_demand_planning/tests

      # test_data.py depends on the local synthetic dataset files and is
      # intentionally excluded from CI because the dataset is not required
      # to exercise the pure unit-test layer.
