name: Customer Churn Validation

on:
  push:
    paths:
      - "Customer Churn Prediction Model/**"
  pull_request:
    paths:
      - "Customer Churn Prediction Model/**"

jobs:
  test-churn-project:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Customer Churn Prediction Model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_pipeline.py
      - run: python src/pipeline.py
      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-validation-outputs
          path: |
            Customer Churn Prediction Model/outputs/*.json
            Customer Churn Prediction Model/outputs/*.txt
            Customer Churn Prediction Model/outputs/*.joblib
          if-no-files-found: error
