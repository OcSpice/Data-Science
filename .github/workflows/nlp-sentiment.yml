name: NLP Sentiment Analysis Validation

on:
  push:
    branches: [main]
    paths:
      - "NLP Sentiment Analysis/**"
      - ".github/workflows/nlp-sentiment.yml"
  pull_request:
    paths:
      - "NLP Sentiment Analysis/**"
      - ".github/workflows/nlp-sentiment.yml"

jobs:
  validate-nlp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "NLP Sentiment Analysis/requirements.txt"

      - name: Install dependencies
        working-directory: "NLP Sentiment Analysis"
        run: python -m pip install -r requirements.txt pytest

      - name: Run NLP unit tests
        working-directory: "NLP Sentiment Analysis"
        run: python -m pytest -q tests/test_pipeline.py

      - name: Run full NLP pipeline
        working-directory: "NLP Sentiment Analysis"
        run: python src/main_pipeline.py

      - name: Upload NLP validation report
        uses: actions/upload-artifact@v4
        with:
          name: nlp-sentiment-validation-output
          path: "NLP Sentiment Analysis/reports/model_evaluation.json"
